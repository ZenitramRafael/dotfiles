# ~/dotfiles/tmux/tmux.conf

# tmux's default escape-time (500ms) makes <Esc> in nvim feel laggy, because
# tmux waits to see if more escape-sequence bytes are coming before passing
# the keypress through. Lower it.
set -sg escape-time 10

# How many lines of scrollback per pane.
set -g history-limit 10000

# Mouse support: click to select a pane, drag borders to resize, scroll to
# scroll a pane's history.
set -g mouse on

# Windows/panes start at 1, not 0 -- 0 is an awkward reach on the keyboard
# and the number row starts at 1 anyway.
set -g base-index 1
setw -g pane-base-index 1

# If you close window 2 out of windows 1,2,3, renumber so it's 1,2 instead
# of leaving a gap.
set -g renumber-windows on

# True color support, so colorschemes in nvim render correctly inside tmux.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reload this config without restarting tmux: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ---- Plugins, managed by TPM (tmux Plugin Manager) ----
# TPM itself is cloned separately (not stored in this repo, see install.sh) --
# this list just declares what TPM should install/manage.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # a baseline of sane defaults others agree on
set -g @plugin 'tmux-plugins/tmux-resurrect'  # save/restore tmux sessions across reboots

# ---- Styling (gruvbox-dark palette, matches the nvim colorscheme) ----

# Status bar background/foreground
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-justify centre
set -g status-left-length 30
set -g status-right-length 50

# Left side: session name, highlighted
set -g status-left "#[bg=#d79921,fg=#282828,bold] #S #[bg=#282828,fg=#d79921,nobold]"

# Right side: date/time
set -g status-right "#[fg=#3c3836,bg=#282828]#[bg=#3c3836,fg=#ebdbb2] %Y-%m-%d %H:%M "

# Window list: current window highlighted in orange, others plain
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#d65d0e,fg=#282828,bold] #I:#W #[bg=#282828,fg=#d65d0e,nobold]"

# Pane borders: subtle when inactive, yellow when active/focused
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"

# Command prompt / messages (e.g. the "reloaded" message from prefix+r)
set -g message-style "bg=#d79921,fg=#282828,bold"

# Keep this line at the very bottom of tmux.conf -- it initializes TPM.
run '~/.tmux/plugins/tpm/tpm'
